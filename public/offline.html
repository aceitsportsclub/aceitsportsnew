<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060a14">
  <title>Offline — ACEIT Sports</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #060a14;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: rgba(14, 23, 44, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 40px 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }
    .emblem {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.4));
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b00 0%, #ff8800 100%);
      color: #ffffff;
      font-weight: 600;
      font-size: 15px;
      padding: 12px 28px;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(255, 107, 0, 0.4);
      transition: transform 0.15s ease;
    }
    .btn-retry:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <img src="/icons/icon-192x192.png" alt="ACEIT Sports" class="emblem">
    <h1>You're Offline</h1>
    <p>ACEIT Sports requires an active internet connection for real-time fixtures, live scores, and club updates.</p>
    <button class="btn-retry" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
